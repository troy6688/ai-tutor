<body><div class="shell"><header class="topbar"><div class="brand"><div class="brand-mark">✦</div><div>AI 智课<small>AI LEARNING PLATFORM</small></div></div><div style="display:flex;align-items:center;gap:10px"><button class="ghost" onclick="go('home.html')">返回首页</button><button class="ghost" onclick="logout()">退出登录</button></div></header>
<main style="max-width:760px;margin:0 auto;padding:24px 16px">
  <div class="glass gradient-border" style="padding:28px;display:flex;align-items:center;gap:18px;margin-bottom:16px">
    <div id="avatar" style="width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#6e63ff,#a78bfa);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800;flex:none">?</div>
    <div><h1 id="pName" style="margin:0;font-size:22px">用户</h1><p class="muted" id="pStage" style="margin:4px 0 0;font-size:13px">—</p></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px">
    <div class="glass gradient-border" style="padding:16px;text-align:center"><div style="font-size:26px;font-weight:800;color:#5a6ae0" id="pLearned">-</div><div class="muted" style="font-size:12px;margin-top:4px">已学知识点</div></div>
    <div class="glass gradient-border" style="padding:16px;text-align:center"><div style="font-size:26px;font-weight:800;color:#5a6ae0" id="pRate">-</div><div class="muted" style="font-size:12px;margin-top:4px">正确率</div></div>
    <div class="glass gradient-border" style="padding:16px;text-align:center"><div style="font-size:26px;font-weight:800;color:#5a6ae0" id="pTotal">-</div><div class="muted" style="font-size:12px;margin-top:4px">累计答题</div></div>
  </div>
  <div class="glass gradient-border" style="padding:8px 18px">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #eef0ff;font-size:14px"><span>我的学习记录</span><button class="ghost" onclick="go('records.html')">查看 →</button></div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #eef0ff;font-size:14px"><span>我的课程</span><button class="ghost" onclick="go('course.html')">进入 →</button></div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:13px 0;font-size:14px;color:#b05b5b;cursor:pointer" onclick="logout()"><span>退出登录</span><span>›</span></div>
  </div>
</main>
</div><script src="assets/app.js?v=20260927-pwa"></script><script>
if(!getToken()){location.href='index.html';}
try{
  var u=currentUser();
  if(u&&u.name){
    document.getElementById('pName').textContent=u.name;
    document.getElementById('avatar').textContent=u.name.slice(0,1);
    document.getElementById('pStage').textContent='当前阶段：'+currentStage();
  }
}catch(e){console.error(e);}
(function(){
  var loadStats = async function(){
    try{
      var s=await apiRequest('/api/stats');
      document.getElementById('pLearned').textContent=s.learned_count != null ? s.learned_count : 0;
      document.getElementById('pRate').textContent=(s.correct_rate != null ? s.correct_rate : 0)+'%';
      document.getElementById('pTotal').textContent=s.total_answered != null ? s.total_answered : 0;
    }catch(e){
      console.error('加载统计数据失败:', e);
      document.getElementById('pLearned').textContent='加载失败';
      document.getElementById('pRate').textContent='—';
      document.getElementById('pTotal').textContent='—';
    }
  };
  loadStats();
})();
</script><script>
// 注册 Service Worker（PWA 离线缓存 + 安装到桌面）
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').then(function(reg) {
      console.log('[PWA] Service Worker 注册成功:', reg.scope);
    }).catch(function(err) {
      console.warn('[PWA] Service Worker 注册失败:', err);
    });
  });
}
</script></body></html>
