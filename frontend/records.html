<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  .main-col{display:flex;flex-direction:column;gap:14px}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .stat{background:linear-gradient(180deg,#fff,#fafbff);border:1px solid #e7e9fb;border-radius:16px;padding:16px 18px;position:relative;overflow:hidden}
  .stat .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;margin-bottom:8px}
  .stat .num{font-size:26px;font-weight:800;color:#2b3a63}
  .stat .lbl{font-size:12px;color:#8a93a6;margin-top:2px}
  .charts{display:grid;grid-template-columns:2fr 1fr;gap:14px}
  .panel{background:#fff;border:1px solid #e7e9fb;border-radius:16px;padding:18px}
  .panel h3{margin:0 0 8px;font-size:15px;color:#2b3a63}
  .chart{height:230px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:#8a93a6;font-weight:600;padding:10px 12px;border-bottom:1px solid #eef0f6}
  td{padding:11px 12px;border-bottom:1px solid #f4f6fa;color:#4a5a7a}
  .score-badge{padding:3px 9px;border-radius:8px;font-weight:700;font-size:12px}
  @media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}}
</style></head>
<body><div class="shell">
<header class="topbar"><div class="brand"><div class="brand-mark">✦</div><div>AI 智课<small>AI LEARNING PLATFORM</small></div></div><div class="top-actions"><span class="muted" id="userName"></span><span class="stage-pill" id="stagePill"></span><button class="ghost" onclick="go('grade.html')">切换学段</button><button class="ghost" onclick="logout()">退出</button></div></header>
<main class="app-layout">
  <aside class="glass gradient-border sidebar">
    <button class="btn-primary new-chat" onclick="go('home.html')">← 返回首页</button>
    <div class="searchbox" style="pointer-events:none;color:#aab3c5">学习记录统计</div>
    <div class="side-bottom">
      <button class="side-link" onclick="go('course.html')">▣ 我的课程</button>
      <button class="side-link" onclick="go('review.html')">📝 复习中心</button>
      <button class="side-link" style="background:#eef0ff;color:#4f5ddd;border-radius:10px">◷ 学习记录</button>
      <button class="side-link" onclick="go('profile.html')">◎ 个人中心</button>
    </div>
  </aside>
  <section class="glass gradient-border chat-home">
    <div class="main-col" style="padding:22px">
      <h2 style="margin:0 0 4px">我的学习记录</h2>
      <p class="muted" style="margin:0 0 8px">按知识点统计你的练习情况</p>
      <div class="cards">
        <div class="stat"><div class="ico" style="background:#eef0ff;color:#5a6ae0">📘</div><div class="num" id="s1">-</div><div class="lbl">已学知识点</div></div>
        <div class="stat"><div class="ico" style="background:#fff0f0;color:#e06666">🎯</div><div class="num" id="s2">-</div><div class="lbl">练习正确率</div></div>
        <div class="stat"><div class="ico" style="background:#fff8e6;color:#e6a700">🔥</div><div class="num" id="s3">-</div><div class="lbl">累计答题</div></div>
        <div class="stat"><div class="ico" style="background:#e8f6ff;color:#3a9ad9">🏆</div><div class="num" id="s4">-</div><div class="lbl">知识点覆盖</div></div>
      </div>
      <div class="charts">
        <div class="panel"><h3>各学段学习进度</h3><div class="chart" id="bar"></div></div>
        <div class="panel"><h3>总完成度</h3><div class="chart" id="ring"></div></div>
      </div>
      <div class="panel">
        <h3>最近练习记录</h3>
        <table><thead><tr><th>知识点</th><th>学段</th><th>答对/总题</th><th>得分</th></tr></thead><tbody id="tbody"><tr><td colspan="4" style="color:#8a93a6">加载中…</td></tr></tbody></table>
      </div>
    </div>
  </section>
</main>
</div><script src="assets/app.js?v=20260927-pwa"></script><script>
if(!getToken()){location.href='index.html';}
try{var u=currentUser();if(u&&u.name)document.getElementById('userName').textContent='你好，'+u.name;document.getElementById('stagePill').textContent=currentStage()+'阶段';}catch(e){console.error(e);}
(function(){
  var init = async function(){
    var s=await apiRequest('/api/stats');
    document.getElementById('s1').textContent=s.learned_count != null ? s.learned_count : 0;
    document.getElementById('s2').textContent=(s.correct_rate != null ? s.correct_rate : 0)+'%';
    document.getElementById('s3').textContent=s.total_answered != null ? s.total_answered : 0;
    document.getElementById('s4').textContent=s.total_points?Math.round(s.learned_count/s.total_points*100)+'%':'0%';
    var tb=document.getElementById('tbody');tb.innerHTML='';
    if(!s.recent||!s.recent.length){tb.innerHTML='<tr><td colspan="4" style="color:#8a93a6">还没有练习记录，去课程里做几道题吧。</td></tr>';}
    else{for(var i=0;i<s.recent.length;i++){
      var r=s.recent[i];
      var tr=document.createElement('tr');
      var c=r.score>=80?'#289865':(r.score>=60?'#c98a1a':'#c05a5a');
      tr.innerHTML='<td>'+escapeHtml(r.title)+'</td><td>'+escapeHtml(r.grade||'-')+'</td><td>'+(r.correct||0)+'/'+(r.total||0)+'</td><td><span class="score-badge" style="background:'+c+'18;color:'+c+'">'+(r.score||0)+'分</span></td>';
      tb.appendChild(tr);
    }}
    var grades=Object.keys(s.by_grade||{});
    var doneArr=grades.map(function(g){return s.by_grade[g].done;});
    var bar=echarts.init(document.getElementById('bar'));
    bar.setOption({
      tooltip:{trigger:'axis'},
      grid:{left:36,right:10,top:20,bottom:28},
      xAxis:{type:'category',data:grades,axisLine:{lineStyle:{color:'#dfe4ee'}},axisLabel:{color:'#8a93a6'}},
      yAxis:{type:'value',splitLine:{lineStyle:{color:'#eef0f6'}},axisLabel:{color:'#8a93a6'}},
      series:[{type:'bar',data:doneArr,barWidth:26,itemStyle:{borderRadius:[6,6,0,0],color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#7c6cff'},{offset:1,color:'#a78bfa'}])}}]
    });
    var pct=s.total_points?Math.round(s.learned_count/s.total_points*100):0;
    var ring=echarts.init(document.getElementById('ring'));
    ring.setOption({
      series:[{type:'pie',radius:['68%','86%'],label:{show:true,position:'center',formatter:pct+'%',fontSize:22,fontWeight:'bold',color:'#2b3a63'},
        data:[{value:pct,itemStyle:{color:new echarts.graphic.LinearGradient(0,0,1,1,[{offset:0,color:'#6e63ff'},{offset:1,color:'#4fc3e8'}])}},{value:100-pct,itemStyle:{color:'#eef0f6'}}]}]
    });
    window.addEventListener('resize',function(){bar.resize();ring.resize();});
  };
  init().catch(function(e){console.error('加载学习记录失败:', e);});
})();
</script><script>
// 注册 Service Worker（PWA 离线缓存 + 安装到桌面）
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').then(function(reg) {
      console.log('[PWA] Service Worker 注册成功:', reg.scope);
    }).catch(function(err) {
      console.warn('[PWA] Service Worker 注册失败:', err);
    });
  });
}
</script></body></html>
