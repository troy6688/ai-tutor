</div><script src="assets/app.js?v=20260927-pwa"></script><script src="assets/course-data.js"></script><script>
if(!getToken()){location.href='index.html';}
try{var u=currentUser();if(u&&u.name)document.getElementById('userName').textContent='你好，'+u.name;}catch(e){}
document.getElementById('stagePill').textContent=currentStage()+'阶段';

var stage=currentStage();
var stageData=(window.STAGE_COURSE_DATA&&window.STAGE_COURSE_DATA[stage])||window.STAGE_COURSE_DATA['小学'];
// 用 ES5 方式生成 LESSON_INDEX（兼容所有浏览器）
var LESSON_INDEX=[];
(function(){
  var units=stageData.units||[];
  for(var i=0;i<units.length;i++){
    var unit=units[i];
    var sections=unit.sections||[];
    for(var j=0;j<sections.length;j++){
      var section=sections[j];
      var items=section.items||[];
      for(var k=0;k<items.length;k++){
        var item=items[k];
        var newItem={};
        for(var key in item){if(item.hasOwnProperty(key))newItem[key]=item[key];}
        newItem.unit=unit.title;
        newItem.section=section.title;
        LESSON_INDEX.push(newItem);
      }
    }
  }
})();

// 查找知识点
function findLessonById(id) {
  return LESSON_INDEX.find(function(item) { return String(item.id) === String(id); });
}

// HTML 转义，防止 XSS
function escHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// 加载复习数据
async function loadReviewData() {
  try {
    var stats = await apiRequest('/api/stats');
    var recent = stats.recent || [];

    // 更新概览数据
    var wrongCount = recent.filter(function(r) { return (r.score || 0) < 60; }).length;
    var weakCount = recent.filter(function(r) { return (r.score || 0) < 80; }).length;
    document.getElementById('statWrong').textContent = wrongCount;
    document.getElementById('statWeak').textContent = weakCount;
    document.getElementById('statLearned').textContent = stats.learned_count || 0;

    // 错题本（得分低于60的）
    var wrongItems = recent.filter(function(r) { return (r.score || 0) < 60; });
    var wrongList = document.getElementById('wrongList');
    if (wrongItems.length > 0) {
      wrongList.innerHTML = '';
      wrongItems.slice(0, 5).forEach(function(item) {
        var div = document.createElement('div');
        div.className = 'wrong-item';
        div.onclick = function() { goReview(item.point_id || item.lesson_id); };
        var wrongNum = (item.total || 0) - (item.correct || 0);
        div.innerHTML =
          '<div class="wrong-top">' +
            '<span class="wrong-title">' + escHtml(item.title) + '</span>' +
            '<span class="wrong-badge">错 ' + wrongNum + ' 题</span>' +
          '</div>' +
          '<div class="wrong-meta">' +
            '<span>得分 ' + (item.score || 0) + ' 分</span>' +
            '<span>' + escHtml(item.unit || '') + '</span>' +
          '</div>';
        wrongList.appendChild(div);
      });
    }

    // 薄弱知识点（得分低于80的，按得分排序）
    var weakItems = recent.filter(function(r) { return (r.score || 0) < 80; })
                            .sort(function(a, b) { return (a.score || 0) - (b.score || 0); });
    var weakGrid = document.getElementById('weakGrid');
    if (weakItems.length > 0) {
      weakGrid.innerHTML = '';
      weakItems.slice(0, 4).forEach(function(item) {
        var div = document.createElement('div');
        div.className = 'weak-card';
        div.onclick = function() { goReview(item.point_id || item.lesson_id); };
        var score = item.score || 0;
        div.innerHTML =
          '<span class="weak-tag">薄弱</span>' +
          '<h4>' + escHtml(item.title) + '</h4>' +
          '<div class="weak-progress"><div class="weak-progress-bar" style="width:' + score + '%"></div></div>' +
          '<div class="weak-score">' +
            '<span>正确率</span>' +
            '<b>' + score + ' 分</b>' +
          '</div>';
        weakGrid.appendChild(div);
      });
    }

    // 知识点归纳（已学的知识点列表）
    var summaryList = document.getElementById('summaryList');
    if (recent.length > 0) {
      summaryList.innerHTML = '';
      recent.slice(0, 6).forEach(function(item) {
        var li = document.createElement('li');
        var score = item.score || 0;
        var statusClass = score >= 80 ? 'good' : (score >= 60 ? 'mid' : 'bad');
        li.innerHTML = '<span class="status-dot ' + statusClass + '"></span>' +
                       '<span style="flex:1">' + escHtml(item.title) + '</span>' +
                       '<span style="color:#9ca3af;font-size:12px;font-weight:600">' + score + '分</span>';
        li.style.cursor = 'pointer';
        li.onclick = function() { goReview(item.point_id || item.lesson_id); };
        summaryList.appendChild(li);
      });
    }

  } catch(e) {
    console.error('加载复习数据失败:', e);
  }
}

// 跳转复习
function goReview(pointId) {
  if (!pointId) return;
  var params = new URLSearchParams({ stage: stage, topic: String(pointId), from: 'review' });
  window.location.href = 'course.html?' + params.toString();
}

// 开始复习
function startReview() {
  window.location.href = 'course.html';
}

// 初始化
loadReviewData();
